id: 8f0c1c2a-1b2e-4c3d-9a10-a1b2c3d4e5f7
name: Prismor critical-risk AI inventory item
severity: High
queryFrequency: PT1H
queryPeriod: P14D
triggerOperator: gt
triggerThreshold: 0
tactics:
  - InitialAccess
version: 1.0.0
query: |
  let window = 1h;
  let prior = PrismorAIInventory_CL
    | where TimeGenerated between (ago(14d) .. ago(window))
    | where RiskLevel =~ "critical" or set_has_element(RiskSignalIds, "THREAT_INTEL")
    | distinct EntityKey;
  PrismorAIInventory_CL
  | where TimeGenerated > ago(window)
  | where RiskLevel =~ "critical" or set_has_element(RiskSignalIds, "THREAT_INTEL")
  | join kind=leftanti prior on EntityKey
  | summarize arg_max(ObservedAt, *) by EntityKey
  | project ObservedAt, Name, Kind, Surface, Hostname, RiskLevel, RiskScore, RiskSignalIds, RecordId
