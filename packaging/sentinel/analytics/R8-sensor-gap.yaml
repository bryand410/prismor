id: 8f0c1c2a-1b2e-4c3d-9a10-a1b2c3d4e5f8
name: Prismor sensor gap
severity: Low
queryFrequency: PT6H
queryPeriod: P7D
triggerOperator: gt
triggerThreshold: 0
tactics:
  - DefenseEvasion
version: 1.0.0
query: |
  let seen7d = PrismorAgentEvents_CL
    | where TimeGenerated > ago(7d)
    | summarize LastSeen=max(TimeGenerated) by Hostname;
  seen7d
  | where LastSeen < ago(24h)
  | project Hostname, LastSeen, HoursSilent = datetime_diff('hour', now(), LastSeen)
