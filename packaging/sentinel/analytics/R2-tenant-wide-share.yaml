id: 8f0c1c2a-1b2e-4c3d-9a10-a1b2c3d4e5f2
name: Prismor agent newly shared tenant-wide
severity: Medium
queryFrequency: PT1H
queryPeriod: P14D
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Collection
version: 1.0.0
query: |
  let window = 1h;
  let prior = PrismorAIInventory_CL
    | where TimeGenerated between (ago(14d) .. ago(window))
    | where Kind in ("lowcode_agent", "cloud_agent", "agent")
    | where set_has_element(RiskSignalIds, "SHARED_TENANT_WIDE")
    | distinct EntityKey;
  PrismorAIInventory_CL
  | where TimeGenerated > ago(window)
  | where Kind in ("lowcode_agent", "cloud_agent", "agent")
  | where set_has_element(RiskSignalIds, "SHARED_TENANT_WIDE")
  | join kind=leftanti prior on EntityKey
  | summarize arg_max(ObservedAt, *) by EntityKey
  | project ObservedAt, Name, Kind, EntraTenantId, RiskScore, RiskSignalIds, RecordId
