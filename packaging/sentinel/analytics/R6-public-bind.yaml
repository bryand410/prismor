id: 8f0c1c2a-1b2e-4c3d-9a10-a1b2c3d4e5f6
name: Prismor AI service publicly bound
severity: High
queryFrequency: PT1H
queryPeriod: P14D
triggerOperator: gt
triggerThreshold: 0
tactics:
  - InitialAccess
version: 1.0.0
query: |
  let window = 1h;
  let prior = PrismorAIInventory_CL
    | where TimeGenerated between (ago(14d) .. ago(window))
    | where Kind in ("mcp_server", "model_runtime", "listener")
    | where set_has_element(RiskSignalIds, "PUBLIC_BIND")
    | distinct HostId, EntityKey;
  PrismorAIInventory_CL
  | where TimeGenerated > ago(window)
  | where Kind in ("mcp_server", "model_runtime", "listener")
  | where set_has_element(RiskSignalIds, "PUBLIC_BIND")
  | join kind=leftanti prior on HostId, EntityKey
  | summarize arg_max(ObservedAt, *) by HostId, EntityKey
  | project ObservedAt, Hostname, HostId, Name, Kind, Path, RiskScore, RiskSignalIds, RecordId
