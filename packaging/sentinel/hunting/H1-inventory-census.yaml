id: 9a1b2c3d-4e5f-4a6b-8c7d-0e1f2a3b4c01
name: Inventory by kind, surface, and managed
severity: Informational
queryFrequency: P1D
queryPeriod: P7D
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Discovery
version: 1.0.0
query: |
  PrismorAIInventory_CL
  | where TimeGenerated > ago(7d)
  | summarize arg_max(ObservedAt, *) by RecordId
  | summarize Items=dcount(RecordId) by Kind, Surface, Managed
